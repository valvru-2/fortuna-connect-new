<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fortuna-favicon-grad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#A43B22" />
      <stop offset="45%" stop-color="#C95F38" />
      <stop offset="85%" stop-color="#E08B5D" />
      <stop offset="100%" stop-color="#EB9E67" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado suave que asegura contraste en pestañas claras y oscuras -->
  <rect width="100" height="100" rx="22" fill="#FAF6F0" />

  <!-- Isotipo centrado con grosor optimizado para escala pequeña -->
  <g transform="translate(0, 8.5)">
    <!-- Curva parabólica -->
    <path d="M 16 76 C 25 32, 40 6, 50 6 C 60 6, 75 32, 84 76" stroke="url(#fortuna-favicon-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Travesaño horizontal -->
    <line x1="12" y1="49" x2="88" y2="49" stroke="url(#fortuna-favicon-grad)" stroke-width="5.5" stroke-linecap="round" />

    <!-- Tallo vertical descendente -->
    <line x1="50" y1="49" x2="50" y2="71" stroke="url(#fortuna-favicon-grad)" stroke-width="5.5" stroke-linecap="round" />
  </g>
</svg>